<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d">
  <title id="t">Dastgir Siddiq (@Dastgir-Siddiq)</title>
  <desc id="d">Profile banner with a name, a handle and a pulsing profile-photo emblem.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/><stop offset=".55" stop-color="#141a33"/><stop offset="1" stop-color="#1c1240"/>
    </linearGradient>
    <linearGradient id="nm" gradientUnits="userSpaceOnUse" x1="64" y1="0" x2="624" y2="0">
      <stop offset="0" stop-color="#8BE9FD"/><stop offset=".55" stop-color="#BD93F9"/><stop offset="1" stop-color="#FF79C6"/>
    </linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
      <stop offset="0" stop-color="#8BE9FD"/><stop offset=".5" stop-color="#BD93F9"/><stop offset="1" stop-color="#FF79C6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="o1"><stop offset="0" stop-color="#7c3aed" stop-opacity=".55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="o2"><stop offset="0" stop-color="#22d3ee" stop-opacity=".32"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="o3"><stop offset="0" stop-color="#f472b6" stop-opacity=".30"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="gm"><rect width="1000" height="300" fill="url(#vig)"/></mask>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="av"><circle r="52"/></clipPath>
    <clipPath id="card"><rect width="1000" height="300" rx="26"/></clipPath>
    <clipPath id="nameClip"><text class="nm" x="64" y="150">Dastgir Siddiq</text></clipPath>
  </defs>
  <style>
    .nm{font-family:"SF Pro Display","Segoe UI Variable Display","Segoe UI","Inter","Helvetica Neue",Arial,system-ui,sans-serif;font-weight:800;font-size:78px}
    .hd{font-family:"JetBrains Mono","SF Mono","Cascadia Code","Fira Code",Consolas,Menlo,"DejaVu Sans Mono",monospace;font-weight:600;font-size:26px}
    .av{font-family:"SF Pro Display","Segoe UI Variable Display","Segoe UI","Inter","Helvetica Neue",Arial,system-ui,sans-serif;font-weight:800;font-size:44px}
    .rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) .15s both}
    .rise2{animation:rise .9s cubic-bezier(.2,.8,.2,1) .45s both}
    @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    .sweep{animation:sweep 7s ease-in-out 1.8s infinite}
    @keyframes sweep{0%{transform:translateX(0)}30%,100%{transform:translateX(1300px)}}
    .o1{animation:d1 18s ease-in-out infinite alternate}
    .o2{animation:d2 22s ease-in-out infinite alternate}
    .o3{animation:d3 20s ease-in-out infinite alternate}
    @keyframes d1{to{transform:translate(90px,40px)}}
    @keyframes d2{to{transform:translate(-110px,-30px)}}
    @keyframes d3{to{transform:translate(70px,-40px)}}
    .ring{fill:none;stroke:#8BE9FD;stroke-width:2;opacity:.4;transform-box:fill-box;transform-origin:center;animation:ring 3.6s cubic-bezier(.2,.6,.3,1) infinite}
    .r2{animation-delay:-1.2s}.r3{animation-delay:-2.4s}
    @keyframes ring{0%{transform:scale(1);opacity:.65}100%{transform:scale(2.1);opacity:0}}
    .orbit{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .travel{animation:travel 8s linear infinite}
    @keyframes travel{to{stroke-dashoffset:-1000}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <circle class="o1" cx="140" cy="30" r="260" fill="url(#o1)"/>
    <circle class="o2" cx="860" cy="290" r="300" fill="url(#o2)"/>
    <circle class="o3" cx="540" cy="330" r="220" fill="url(#o3)"/>
    <rect width="1000" height="300" fill="url(#grid)" mask="url(#gm)"/>

    <g class="rise">
      <text class="nm" x="64" y="150" fill="url(#nm)">Dastgir Siddiq</text>
      <g clip-path="url(#nameClip)"><g class="sweep"><rect x="-300" y="80" width="150" height="100" fill="url(#shine)" transform="skewX(-20)"/></g></g>
    </g>
    <text class="hd rise2" x="66" y="202" fill="#8BE9FD">@Dastgir-Siddiq</text>
    <text class="hd rise2" x="66" y="235" fill="#a5b4fc" font-size="18px" opacity="0.85">Building Android tools, custom recoveries,</text>
    <text class="hd rise2" x="66" y="260" fill="#a5b4fc" font-size="18px" opacity="0.85">and exploring open-source technology.</text>

    <g transform="translate(830 150)">
      <circle class="ring" r="56"/><circle class="ring r2" r="56"/><circle class="ring r3" r="56"/>
      <g class="orbit">
        <circle r="110" fill="none"/>
        <circle r="98" fill="none" stroke="#BD93F9" stroke-opacity=".4" stroke-width="1.5" stroke-dasharray="2 9" stroke-linecap="round"/>
        <circle cx="98" r="11" fill="#FF79C6" opacity=".45" filter="url(#glow)"/>
        <circle cx="98" r="5" fill="#FF79C6"/>
      </g>
      <!-- Avatar slot: `python3 embed-avatar.py` swaps this group for your photo -->
      <g id="avatar"><image href="data:image/jpeg;base64," x="-53" y="-53" width="106" height="106" preserveAspectRatio="xMidYMid slice" clip-path="url(#av)"/></g>
      <circle r="56" fill="none" stroke="#8BE9FD" stroke-width="2.5"/>
    </g>
  </g>

  <rect x="1" y="1" width="998" height="298" rx="25" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="1.5"/>
  <rect class="travel" x="1" y="1" width="998" height="298" rx="25" fill="none" stroke="url(#edge)" stroke-width="2.5" stroke-linecap="round" pathLength="1000" stroke-dasharray="130 870"/>
</svg>