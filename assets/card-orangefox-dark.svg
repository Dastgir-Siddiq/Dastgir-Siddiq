    <radialGradient id="gl" cx="1" cy="0" r=".9">
      <stop offset="0" stop-color="#F97316" stop-opacity=".2"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect width="420" height="165" rx="18"/></clipPath>
  </defs>
  <style>
