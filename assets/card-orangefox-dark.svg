<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 165" width="420" height="165" role="img" aria-label="OrangeFox Recovery: Custom recovery builds for Galaxy Tab A7 and Realme 12 Pro+ with kernel bring-up.">
  <title>OrangeFox Recovery</title>
  <defs>
