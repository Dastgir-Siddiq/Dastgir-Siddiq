<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150" role="img" aria-label="Personal Cloud: High-speed local Wi-Fi file server and media streaming for Android devices.">
  <title>Personal Cloud</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f6ff"/></linearGradient>
    <radialGradient id="gl" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#0e7490" stop-opacity=".18"/><stop offset="1" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="400" height="150" rx="16"/></clipPath>
  </defs>
  <style>
    .t{font-family:"SF Pro Display","Segoe UI Variable Display","Segoe UI","Inter","Helvetica Neue",Arial,system-ui,sans-serif;font-weight:700;font-size:21px;fill:#1f2340}
    .d{font-family:"SF Pro Display","Segoe UI Variable Display","Segoe UI","Inter","Helvetica Neue",Arial,system-ui,sans-serif;font-size:15px;fill:#4b5563}
    .halo{fill:none;stroke:#0e7490;stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center;animation:halo 3.6s ease-out 0.0s infinite}
    @keyframes halo{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.9);opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#c)">
    <rect width="400" height="150" fill="url(#bg)"/>
    <rect width="400" height="150" fill="url(#gl)"/>
    <circle class="halo" cx="48" cy="48" r="24"/>
    <rect x="24" y="24" width="48" height="48" rx="14" fill="#0e7490" fill-opacity=".12" stroke="#0e7490" stroke-opacity=".4" stroke-width="1.5"/>
    <g transform="translate(36 36) scale(1.0)" fill="none" stroke="#0e7490" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
      <polyline points="8 13 12 9 16 13"/>
      <line x1="12" y1="9" x2="12" y2="17"/>
    </g>
    <text class="t" x="88" y="55">Personal Cloud</text>
    <text class="d" x="24" y="107">High-speed local Wi-Fi file server and</text>
    <text class="d" x="24" y="129">media streaming for Android devices.</text>
  </g>
  <rect x=".75" y=".75" width="398.5" height="148.5" rx="15.5" fill="none" stroke="#d5dbea" stroke-width="1.5"/>
</svg>